# =============================================================================
# Services:
#   pharmaflow-db    PostgreSQL 15 — data warehouse
#   airflow-db       PostgreSQL 15 — Airflow metadata store
#   airflow-init     One-time Airflow setup (DB init + admin user creation)
#   airflow-webserver Airflow UI  → http://localhost:8080
#   airflow-scheduler DAG scheduler
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose down               # stop everything (data preserved)
#   docker compose down -v            # stop + delete volumes (destructive)
#   docker compose logs -f airflow-scheduler
#
# Airflow UI credentials: admin / pharmaflow2024
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  platform: linux/arm64
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    _PIP_ADDITIONAL_REQUIREMENTS: 'psycopg2-binary pandas openpyxl python-dotenv'
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Africa/Johannesburg'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow2024@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: 'pharmaflow-secret-2024'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # iCloud SMTP settings for email alerts for monitoring
    AIRFLOW__SMTP__SMTP_HOST: smtp.mail.me.com
    AIRFLOW__SMTP__SMTP_STARTTLS: 'true'
    AIRFLOW__SMTP__SMTP_SSL: 'false'
    AIRFLOW__SMTP__SMTP_USER: boikanyo.m0040@icloud.com
    AIRFLOW__SMTP__SMTP_PASSWORD: vvej-dnek-gpzj-krse
    AIRFLOW__SMTP__SMTP_PORT: '587'
    AIRFLOW__SMTP__SMTP_MAIL_FROM: boikanyo.m0040@icloud.com
    # PharmaFlow warehouse connection (env vars)
    PHARMAFLOW_DB_HOST: pharmaflow-db
    PHARMAFLOW_DB_PORT: '5432'
    PHARMAFLOW_DB_NAME: pharmaflow_warehouse
    PHARMAFLOW_DB_USER: pharmaflow
    PHARMAFLOW_DB_PASSWORD: pharmaflow2024
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./python:/opt/airflow/python          # ETL modules available to DAGs
    - ./scripts:/opt/airflow/scripts        # Shell scripts available to DAGs
    - ./raw_data:/opt/airflow/raw_data      # File drop zone
    - ./staging:/opt/airflow/staging
    - ./processed:/opt/airflow/processed
    - ./archive:/opt/airflow/archive
    - ./logs:/opt/airflow/pipeline_logs
  depends_on:
    airflow-db:
      condition: service_healthy
  networks:
    - pharmaflow-network

services:

  # ---------------------------------------------------------------------------
  # Reuses existing named volume (all data is preserved)
  # ---------------------------------------------------------------------------
  pharmaflow-db:
    image: postgres:15
    platform: linux/arm64
    container_name: pharmaflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: pharmaflow2024
      POSTGRES_DB: pharmaflow_warehouse
    ports:
      - "5433:5432"
    volumes:
      - pharmaflow-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d/sql   # schema available inside container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaflow -d pharmaflow_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaflow-network

  # ---------------------------------------------------------------------------
  # Airflow Metadata Database (separate from warehouse)
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:15
    platform: linux/arm64
    container_name: airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow2024
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaflow-network

  # ---------------------------------------------------------------------------
  # Airflow Init (runs once to set up DB and create admin user)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname PharmaFlow \
          --lastname Admin \
          --role Admin \
          --email admin@pharmaflow.co.za \
          --password pharmaflow2024
        echo "Airflow initialised successfully."
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow Webserver → http://localhost:8080
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Zookeeper (Kafka dependency)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    platform: linux/arm64
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - pharmaflow-network

  # ---------------------------------------------------------------------------
  # Kafka Broker
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    platform: linux/arm64
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"       # internal (producer/consumer inside Docker)
      - "9093:9093"       # external (producer/consumer on my Mac)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168      # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - pharmaflow-network

  # ---------------------------------------------------------------------------
  # Kafka UI (browser-based topic/message viewer) → http://localhost:8090
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    platform: linux/arm64
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pharmaflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - pharmaflow-network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  pharmaflow-data:
    external: true
  airflow-db-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  pharmaflow-network:
    driver: bridge

